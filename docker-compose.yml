version: '3.8'
services:
  api:
    build:
      context: .
      dockerfile: EventManagementSystem.Api/Dockerfile
    image: eventmanagementsystem_api:latest
    ports:
      - "5003:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api